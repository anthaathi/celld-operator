---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: celld-operator
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.celld.dev
  resources:
  - celldfleets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - platform.celld.dev
  resources:
  - celldfleets/finalizers
  verbs:
  - update
- apiGroups:
  - platform.celld.dev
  resources:
  - celldfleets/status
  verbs:
  - get
  - patch
  - update
