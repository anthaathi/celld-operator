---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: celldfleets.platform.celld.dev
spec:
  group: platform.celld.dev
  names:
    kind: CelldFleet
    listKind: CelldFleetList
    plural: celldfleets
    singular: celldfleet
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .spec.objectStorage.bucket
      name: Bucket
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CelldFleetSpec describes one celld fleet and therefore one
              public application.
            properties:
              image:
                default: ghcr.io/denoland/celld:v0.4.0
                description: Image is the celld runtime image.
                type: string
              ingress:
                description: |-
                  Ingress optionally configures automatic external exposure of the public
                  Worker Service through a classic Ingress or a Gateway API HTTPRoute.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Annotations are merged into the created route's metadata.
                    type: object
                  gatewayRefs:
                    description: |-
                      GatewayRefs attaches the fleet to one or more existing Gateways by
                      namespace/name. Set this to use Gateway API HTTPRoutes instead of
                      classic Ingress. Exactly one of ingressClass and gatewayRefs must be set.
                    items:
                      description: |-
                        GatewayRef names a Gateway in the same namespace as the CelldFleet unless
                        Namespace is set.
                      properties:
                        name:
                          minLength: 1
                          type: string
                        namespace:
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  hostname:
                    description: |-
                      Hostname is the fully qualified public hostname for this fleet, for
                      example demo.example.com. It is used for Ingress rules and HTTPRoute
                      hostnames, and for the https:// URL reported in status.
                    minLength: 1
                    type: string
                  ingressClass:
                    description: |-
                      IngressClass is the spec.ingressClassName of the created Ingress. Set
                      this to use classic Ingress (nginx, traefik, kong, ...). Exactly one of
                      ingressClass and gatewayRefs must be set.
                    type: string
                  path:
                    default: /
                    description: Path is an optional path prefix routed to the fleet.
                      Defaults to "/".
                    pattern: ^/.*
                    type: string
                  pathType:
                    default: Prefix
                    description: PathType for the Ingress rule. Defaults to Prefix.
                    enum:
                    - Exact
                    - Prefix
                    - ImplementationSpecific
                    type: string
                  stripPrefix:
                    description: |-
                      StripPrefix removes the Path prefix from the request before it reaches
                      the Worker. This lets one hostname serve multiple fleets, each mounted
                      at its own subpath: a request to /api/hello with Path=/api and
                      StripPrefix=true reaches the Worker as /hello. It is implemented with
                      the nginx rewrite annotation for Ingress, and URL rewrite filters for
                      Gateway API HTTPRoutes. Defaults to false.
                    type: boolean
                  tls:
                    description: TLS configures certificate termination for the created
                      route.
                    properties:
                      certificateSecretRef:
                        description: |-
                          CertificateSecretRef references an existing TLS Secret. For classic
                          Ingress it is used directly. For HTTPRoute it becomes a
                          GatewayTLSConfig reference.
                        type: string
                      clusterIssuer:
                        description: |-
                          ClusterIssuer requests a certificate with cert-manager. The operator
                          annotates the route (cert-manager.io/cluster-issuer) so cert-manager
                          creates the companion Certificate/Secret for the hostname.
                        type: string
                    type: object
                required:
                - hostname
                type: object
              localStorage:
                properties:
                  size:
                    default: 10Gi
                    description: Size is required by Persistent storage and defaults
                      to 10Gi.
                    type: string
                  storageClassName:
                    type: string
                  type:
                    default: Ephemeral
                    description: Type is Ephemeral or Persistent. Ephemeral is intended
                      for this local POC.
                    enum:
                    - Ephemeral
                    - Persistent
                    type: string
                type: object
              objectStorage:
                properties:
                  allowHTTP:
                    description: |-
                      AllowHTTP permits a plain-HTTP S3-compatible endpoint. Use only for local development.
                      Leave false when spec.storeRef is set; the store provides the setting.
                    type: boolean
                  bucket:
                    description: Bucket is an s3:// bucket with an optional prefix.
                      One prefix is one fleet.
                    pattern: ^s3://[^/]+(/.*)?$
                    type: string
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef names a Secret whose keys are injected as environment variables.
                      Common keys are AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and AWS_SESSION_TOKEN.
                      Leave empty when spec.storeRef is set; the store provides the secret.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  endpoint:
                    description: |-
                      Endpoint configures an S3-compatible service such as R2 or MinIO.
                      Leave empty when spec.storeRef is set; the store provides the endpoint.
                    type: string
                  region:
                    description: |-
                      Region defaults to us-east-1. Leave empty when spec.storeRef is set;
                      the store provides the region. The default is applied at resolution
                      time rather than by the API server, so fleets using storeRef can keep
                      objectStorage free of connection fields.
                    type: string
                required:
                - bucket
                type: object
              replicas:
                default: 1
                description: Replicas is the number of celld nodes. Two or more enable
                  low-latency fleet durability.
                format: int32
                minimum: 1
                type: integer
              resources:
                description: Resources configures requests and limits for each celld
                  node.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              service:
                properties:
                  type:
                    default: ClusterIP
                    description: Type controls the public Worker Service.
                    enum:
                    - ClusterIP
                    - NodePort
                    - LoadBalancer
                    type: string
                type: object
              storeRef:
                description: |-
                  StoreRef references a CelldObjectStore that provides the shared
                  connection configuration (endpoint, region, credentials, allowHTTP) for
                  this fleet's object storage. When set, objectStorage.bucket is still
                  required, but objectStorage connection fields (endpoint, region,
                  allowHTTP, credentialsSecretRef) must be empty — they come from the store.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
            required:
            - objectStorage
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              readyReplicas:
                format: int32
                type: integer
              serviceName:
                type: string
              url:
                description: |-
                  URL reports the public entry point when ingress is configured, for
                  example https://demo.example.com.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
