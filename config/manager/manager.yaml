apiVersion: v1
kind: Namespace
metadata:
  name: celld-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: celld-operator
  namespace: celld-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celld-operator
  namespace: celld-system
  labels:
    app.kubernetes.io/name: celld-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: celld-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celld-operator
    spec:
      serviceAccountName: celld-operator
      securityContext:
        runAsNonRoot: true
      containers:
      - name: manager
        image: celld-operator:poc
        imagePullPolicy: IfNotPresent
        args:
        - --leader-elect
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        ports:
        - name: metrics
          containerPort: 8080
        - name: health
          containerPort: 8081
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true