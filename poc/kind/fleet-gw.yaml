# Fleet exposed through Gateway API instead of classic Ingress:
# the operator creates an HTTPRoute attached to the "celld" Gateway.
apiVersion: platform.celld.dev/v1alpha1
kind: CelldFleet
metadata:
  name: local-gw
  namespace: celld-poc
spec:
  replicas: 1
  image: ghcr.io/denoland/celld:v0.4.0
  storeRef:
    name: minio
  objectStorage:
    bucket: s3://celld/local-poc-gw
  localStorage:
    type: Ephemeral
  service:
    type: ClusterIP
  ingress:
    hostname: gw.celld.dev
    gatewayRefs:
    - name: celld
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
