name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build plugin for all platforms
        run: |
          mkdir -p dist
          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" \
              -o "dist/kubectl-celld_${os}_${arch}" \
              ./cmd/kubectl-celld
            (cd dist && sha256sum "kubectl-celld_${os}_${arch}" > "kubectl-celld_${os}_${arch}.sha256")
          done
          ls -la dist/

      - name: Build operator image tarball
        run: |
          # Bundle the operator image so POC clusters without a registry can
          # `docker load` it. Requires buildah or docker; use buildah which is
          # preinstalled on GitHub runners and works rootless.
          buildah bud -f Dockerfile -t celld-operator:${GITHUB_REF_NAME} .
          buildah push celld-operator:${GITHUB_REF_NAME} \
            oci-archive:dist/celld-operator-image_${GITHUB_REF_NAME}.tar:${GITHUB_REF_NAME}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
