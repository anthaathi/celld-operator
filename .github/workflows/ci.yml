name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # `make verify` runs kubectl kustomize on config/, which needs kubectl.
      - name: Install kubectl
        run: |
          curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" \
            -o /usr/local/bin/kubectl
          chmod +x /usr/local/bin/kubectl

      - name: Verify (test, vet, build, kustomize)
        run: make verify

      - name: Build plugin
        run: |
          make plugin
          ./bin/kubectl-celld --help

      - name: Check generated manifests are up to date
        run: |
          make manifests
          git diff --exit-code -- api/v1alpha1/zz_generated.deepcopy.go config/crd config/rbac

  plugin-matrix:
    name: Build plugin (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" \
            -o "dist/kubectl-celld_${{ matrix.os }}_${{ matrix.arch }}" \
            ./cmd/kubectl-celld

      - uses: actions/upload-artifact@v4
        with:
          name: kubectl-celld_${{ matrix.os }}_${{ matrix.arch }}
          path: dist/*
