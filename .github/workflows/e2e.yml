name: E2E

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: kind end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build images and plugin
        run: |
          make plugin
          docker build -t celld-operator:e2e .
          docker build -f deployer.Dockerfile -t celld-deployer:e2e .

      - name: Run e2e
        run: bash scripts/e2e.sh celld-operator:e2e celld-deployer:e2e
